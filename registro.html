<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Crear cuenta - TU EMPLEO ES HOY</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
    }

    header {
        background: #0b5ed7;
        color: white;
        padding: 18px;
        text-align: center;
    }

    header a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .contenedor {
        width: 100%;
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
    }

    .tarjeta {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
        text-align: center;
        color: #0b5ed7;
        margin-top: 0;
    }

    .descripcion {
        text-align: center;
        color: #555;
        margin-bottom: 25px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 7px;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 16px;
    }

    input:focus {
        outline: none;
        border-color: #0b5ed7;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        border-radius: 7px;
        background: #0b5ed7;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #084298;
    }

    #mensaje {
        margin-top: 20px;
        text-align: center;
        font-weight: bold;
    }

    .login {
        text-align: center;
        margin-top: 20px;
    }

    .login a {
        color: #0b5ed7;
        font-weight: bold;
    }

    /* ==============================
       ACEPTACIÓN DE TÉRMINOS
       ============================== */

    .aceptacion {
        margin-top: 18px;
    }

    .checkbox {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-weight: normal;
        line-height: 1.5;
        cursor: pointer;
    }

    .checkbox input {
        width: auto;
        margin-top: 4px;
        cursor: pointer;
    }

    .checkbox span {
        font-size: 14px;
        color: #555;
    }

    .checkbox a {
        color: #0b5ed7;
        font-weight: bold;
        text-decoration: none;
    }

    .checkbox a:hover {
        text-decoration: underline;
    }

</style>


</head>

<body>

<header>


<a href="index.html">
    🪖 TU EMPLEO ES HOY
</a>


</header>

<div class="contenedor">


<div class="tarjeta">

    <h1>
        Crear cuenta
    </h1>


    <p class="descripcion">
        Crea tu cuenta para buscar empleos y enviar
        tus postulaciones.
    </p>


    <form id="formRegistro">

        <label for="nombre">
            Nombre completo
        </label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre completo"
            required
        >


        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@correo.com"
            required
        >


        <label for="celular">
            Número de celular
        </label>

        <input
            type="tel"
            id="celular"
            name="celular"
            placeholder="809-000-0000"
            required
        >


        <label for="contrasena">
            Contraseña
        </label>

        <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="Crea una contraseña"
            required
        >


        <!-- ACEPTACIÓN DE TÉRMINOS -->

        <div class="aceptacion">

            <label class="checkbox">

                <input
                    type="checkbox"
                    id="aceptar"
                    required
                >

                <span>

                    Acepto los

                    <a
                        href="terminos.html"
                        target="_blank"
                    >
                        Términos y condiciones
                    </a>,

                    la

                    <a
                        href="politica-privacidad.html"
                        target="_blank"
                    >
                        Política de privacidad
                    </a>

                    y la

                    <a
                        href="cookies.html"
                        target="_blank"
                    >
                        Política de cookies
                    </a>.

                </span>

            </label>

        </div>


        <button type="submit">
            Crear mi cuenta
        </button>

    </form>


    <div id="mensaje"></div>


    <div class="login">

        ¿Ya tienes una cuenta?

        <a href="login.html">
            Inicia sesión
        </a>

    </div>

</div>


</div>

<script>

const formulario =
    document.getElementById("formRegistro");

const mensaje =
    document.getElementById("mensaje");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        mensaje.textContent =
            "Creando cuenta...";

        mensaje.style.color =
            "#555";


        const datos = {

            nombre:
                document
                    .getElementById("nombre")
                    .value
                    .trim(),

            correo:
                document
                    .getElementById("correo")
                    .value
                    .trim(),

            celular:
                document
                    .getElementById("celular")
                    .value
                    .trim(),

            contrasena:
                document
                    .getElementById("contrasena")
                    .value

        };


        try {

            const respuesta =
                await fetch(
                    "/api/registro",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(datos)

                    }
                );


            const resultado =
                await respuesta.json();


            if (resultado.ok) {

                mensaje.textContent =
                    "✅ Cuenta creada correctamente.";

                mensaje.style.color =
                    "green";


                formulario.reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1500
                );


            } else {

                mensaje.textContent =
                    "❌ " +
                    resultado.mensaje;

                mensaje.style.color =
                    "red";

            }


        } catch (error) {

            console.error(error);


            mensaje.textContent =
                "❌ No se pudo conectar con el servidor.";

            mensaje.style.color =
                "red";

        }

    }
);

</script>

</body>

</html>
