<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ofertas de empleo - TU EMPLEO ES HOY</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 18px 25px;
        }

        .barra {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
        }

        nav a:hover {
            background: rgba(255,255,255,0.15);
        }

        .contenedor {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .titulo h1 {
            color: #0b5ed7;
            margin-bottom: 8px;
        }

        .barra-busqueda {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            margin-bottom: 25px;
        }

        .barra-busqueda input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .ofertas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .oferta {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .oferta h2 {
            color: #0b5ed7;
            margin-top: 0;
        }

        .dato {
            margin: 8px 0;
        }

        .descripcion {
            line-height: 1.6;
            color: #555;
            margin: 18px 0;
        }

        .boton {
            background: #0b5ed7;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background: #084298;
        }

        .boton:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .mensaje {
            text-align: center;
            padding: 30px;
            font-weight: bold;
        }

        .mensaje-aplicacion {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 750px) {

            .barra {
                flex-direction: column;
            }

            .ofertas {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>


<header>

    <div class="barra">

        <a class="logo" href="index.html">
            🪖 TU EMPLEO ES HOY
        </a>

        <nav>

            <a href="index.html">
                Inicio
            </a>

            <a href="perfil.html">
                Mi perfil
            </a>

            <a href="login.html">
                Iniciar sesión
            </a>

        </nav>

    </div>

</header>


<main class="contenedor">


    <div class="titulo">

        <h1>
            🔎 Ofertas de empleo
        </h1>

        <p>
            Encuentra una oportunidad y aplica a ella.
        </p>

    </div>


    <div class="barra-busqueda">

        <input
            type="search"
            id="buscar"
            placeholder="Buscar por puesto, empresa o ubicación..."
        >

    </div>


    <div
        id="mensaje"
        class="mensaje">

        Cargando ofertas...

    </div>


    <div
        id="listaOfertas"
        class="ofertas">

    </div>


</main>


<script>

let todasLasOfertas = [];


// =====================================================
// CARGAR OFERTAS
// =====================================================

async function cargarOfertas() {

    const mensaje =
        document.getElementById("mensaje");

    try {

        const respuesta =
            await fetch("/api/ofertas");


        const resultado =
            await respuesta.json();


        if (!resultado.ok) {

            mensaje.textContent =
                "❌ " + resultado.mensaje;

            return;
        }


        todasLasOfertas =
            resultado.ofertas || [];


        mensaje.style.display =
            "none";


        mostrarOfertas(
            todasLasOfertas
        );


    } catch (error) {

        console.error(error);

        mensaje.textContent =
            "❌ No se pudo conectar con el servidor.";

    }

}


// =====================================================
// MOSTRAR OFERTAS
// =====================================================

function mostrarOfertas(ofertas) {

    const lista =
        document.getElementById(
            "listaOfertas"
        );


    if (!ofertas.length) {

        lista.innerHTML = `
            <div class="mensaje">
                No hay ofertas disponibles actualmente.
            </div>
        `;

        return;
    }


    lista.innerHTML =
        ofertas.map(oferta => `

            <article class="oferta">

                <h2>
                    ${escapeHTML(oferta.titulo)}
                </h2>

                <div class="dato">
                    🏢 <strong>Empresa:</strong>
                    ${escapeHTML(oferta.empresa)}
                </div>

                <div class="dato">
                    📍 <strong>Ubicación:</strong>
                    ${escapeHTML(oferta.ubicacion)}
                </div>

                ${
                    oferta.salario
                    ?
                    `
                    <div class="dato">
                        💰 <strong>Salario:</strong>
                        ${escapeHTML(oferta.salario)}
                    </div>
                    `
                    :
                    ""
                }

                <div class="descripcion">
                    ${escapeHTML(oferta.descripcion)}
                </div>

                <button
                    class="boton"
                    onclick="aplicar(${Number(oferta.id)}, this)">

                    Aplicar a esta oferta

                </button>

                <div
                    id="mensaje-${Number(oferta.id)}"
                    class="mensaje-aplicacion">

                </div>

            </article>

        `).join("");

}


// =====================================================
// APLICAR
// =====================================================

async function aplicar(ofertaId, boton) {

    const mensaje =
        document.getElementById(
            "mensaje-" + ofertaId
        );


    boton.disabled = true;

    boton.textContent =
        "Enviando...";


    try {

        const respuesta =
            await fetch(
                "/api/postulaciones",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials:
                        "same-origin",

                    body: JSON.stringify({
                        oferta_id: ofertaId
                    })
                }
            );


        const resultado =
            await respuesta.json();


        if (resultado.ok) {

            mensaje.textContent =
                "✅ " + resultado.mensaje;

            mensaje.style.color =
                "green";

            boton.textContent =
                "Aplicación enviada";

            return;
        }


        mensaje.textContent =
            "❌ " + resultado.mensaje;

        mensaje.style.color =
            "red";


        boton.disabled = false;

        boton.textContent =
            "Aplicar a esta oferta";


        if (
            resultado.mensaje ===
            "Debes iniciar sesión."
        ) {

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1200);

        }

    } catch (error) {

        console.error(error);

        mensaje.textContent =
            "❌ No se pudo conectar con el servidor.";

        mensaje.style.color =
            "red";

        boton.disabled = false;

        boton.textContent =
            "Aplicar a esta oferta";

    }

}


// =====================================================
// BUSCADOR
// =====================================================

document
    .getElementById("buscar")
    .addEventListener(
        "input",
        function() {

            const texto =
                this.value
                    .trim()
                    .toLowerCase();


            const filtradas =
                todasLasOfertas.filter(
                    oferta => {

                        return (

                            String(
                                oferta.titulo || ""
                            )
                            .toLowerCase()
                            .includes(texto)

                            ||

                            String(
                                oferta.empresa || ""
                            )
                            .toLowerCase()
                            .includes(texto)

                            ||

                            String(
                                oferta.ubicacion || ""
                            )
                            .toLowerCase()
                            .includes(texto)

                        );

                    }
                );


            mostrarOfertas(
                filtradas
            );

        }
    );


// =====================================================
// SEGURIDAD
// =====================================================

function escapeHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// =====================================================
// INICIO
// =====================================================

cargarOfertas();

</script>


</body>

</html>
