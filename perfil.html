<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi perfil - TU EMPLEO ES HOY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #0b5ed7;
            color: white;
            padding: 18px 25px;
        }

        .barra {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 23px;
            font-weight: bold;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a,
        nav button {
            color: white;
            text-decoration: none;
            background: transparent;
            border: none;
            font-size: 15px;
            cursor: pointer;
            padding: 8px 10px;
        }

        nav a:hover,
        nav button:hover {
            background: rgba(255,255,255,0.15);
            border-radius: 6px;
        }

        .contenedor {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .titulo h1 {
            color: #0b5ed7;
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .tarjeta h2 {
            margin-top: 0;
            color: #0b5ed7;
        }

        .dato {
            margin: 14px 0;
            padding: 12px;
            background: #f4f7fb;
            border-radius: 7px;
        }

        .dato strong {
            display: block;
            margin-bottom: 5px;
        }

        .boton {
            display: inline-block;
            padding: 12px 18px;
            background: #0b5ed7;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .boton:hover {
            background: #084298;
        }

        .boton-secundario {
            background: #198754;
        }

        .boton-secundario:hover {
            background: #146c43;
        }

        input[type="file"] {
            width: 100%;
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        #mensajeCurriculum {
            margin-top: 15px;
            font-weight: bold;
        }

        #curriculumActual {
            margin-top: 15px;
            padding: 12px;
            background: #e9f7ef;
            border-radius: 7px;
        }

        .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .mensajeGeneral {
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .barra {
                flex-direction: column;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="barra">

        <a class="logo" href="index.html">
            🪖 TU EMPLEO ES HOY
        </a>

        <nav>

            <a href="ofertas.html">
                Ofertas
            </a>

            <a href="perfil.html">
                Mi perfil
            </a>

            <button id="btnCerrarSesion">
                Cerrar sesión
            </button>

        </nav>

    </div>

</header>


<main class="contenedor">

    <div class="titulo">

        <h1>
            👤 Mi perfil
        </h1>

        <p>
            Administra tu información y tu currículum.
        </p>

    </div>


    <div id="mensajeGeneral" class="mensajeGeneral">
        Cargando perfil...
    </div>


    <div id="contenidoPerfil" style="display:none;">

        <div class="grid">


            <!-- INFORMACIÓN DEL USUARIO -->

            <div class="tarjeta">

                <h2>
                    👤 Mis datos
                </h2>

                <div class="dato">

                    <strong>
                        Nombre
                    </strong>

                    <span id="nombreUsuario">
                        —
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Correo
                    </strong>

                    <span id="correoUsuario">
                        —
                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Teléfono
                    </strong>

                    <span id="celularUsuario">
                        —
                    </span>

                </div>

            </div>


            <!-- CURRICULUM -->

            <div class="tarjeta">

                <h2>
                    📄 Mi currículum
                </h2>

                <p>
                    Sube tu currículum para poder aplicar
                    a las ofertas de empleo.
                </p>


                <form id="formCurriculum">

                    <input
                        type="file"
                        id="archivo"
                        accept=".pdf,.doc,.docx"
                        required
                    >


                    <button
                        type="submit"
                        class="boton boton-secundario">

                        Subir currículum

                    </button>

                </form>


                <div id="mensajeCurriculum"></div>


                <div id="curriculumActual"
                     style="display:none;">

                </div>

            </div>

        </div>


        <!-- ACCIONES -->

        <div class="tarjeta" style="margin-top:22px;">

            <h2>
                🚀 Acciones
            </h2>

            <div class="acciones">

                <a
                    href="ofertas.html"
                    class="boton">

                    🔎 Buscar empleos

                </a>


                <a
                    href="postulantes.html"
                    class="boton">

                    📋 Mis postulaciones

                </a>

            </div>

        </div>

    </div>

</main>


<script>

let usuarioActual = null;


// =====================================================
// CARGAR PERFIL
// =====================================================

async function cargarPerfil() {

    const mensaje =
        document.getElementById("mensajeGeneral");

    try {

        const respuesta = await fetch(
            "/api/perfil",
            {
                credentials: "same-origin"
            }
        );

        const resultado = await respuesta.json();


        if (!resultado.ok) {

            mensaje.textContent =
                "❌ " + resultado.mensaje;

            setTimeout(function() {

                window.location.href = "login.html";

            }, 1200);

            return;
        }


        usuarioActual = resultado.usuario;


        document.getElementById(
            "nombreUsuario"
        ).textContent =
            usuarioActual.nombre;


        document.getElementById(
            "correoUsuario"
        ).textContent =
            usuarioActual.correo;


        document.getElementById(
            "celularUsuario"
        ).textContent =
            usuarioActual.celular;


        mostrarCurriculum(
            resultado.curriculum
        );


        mensaje.style.display = "none";

        document.getElementById(
            "contenidoPerfil"
        ).style.display = "block";


    } catch (error) {

        console.error(error);

        mensaje.textContent =
            "❌ No se pudo conectar con el servidor.";

    }

}


// =====================================================
// MOSTRAR CURRICULUM
// =====================================================

function mostrarCurriculum(curriculum) {

    const elemento =
        document.getElementById(
            "curriculumActual"
        );


    if (!curriculum) {

        elemento.style.display = "none";

        return;
    }


    elemento.style.display = "block";

    elemento.innerHTML = `
        📄 <strong>Currículum cargado</strong><br>
        Archivo: ${escapeHTML(curriculum.nombre_archivo)}<br>
        Fecha: ${escapeHTML(curriculum.fecha_subida)}
    `;
}


// =====================================================
// SUBIR CURRICULUM
// =====================================================

document
    .getElementById("formCurriculum")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const archivo =
                document.getElementById(
                    "archivo"
                ).files[0];


            const mensaje =
                document.getElementById(
                    "mensajeCurriculum"
                );


            if (!archivo) {

                mensaje.textContent =
                    "❌ Selecciona un archivo.";

                mensaje.style.color = "red";

                return;
            }


            const datos =
                new FormData();

            datos.append(
                "curriculum",
                archivo
            );


            mensaje.textContent =
                "Subiendo currículum...";

            mensaje.style.color = "#555";


            try {

                const respuesta =
                    await fetch(
                        "/api/curriculum",
                        {
                            method: "POST",
                            credentials: "same-origin",
                            body: datos
                        }
                    );


                const resultado =
                    await respuesta.json();


                if (!resultado.ok) {

                    mensaje.textContent =
                        "❌ " + resultado.mensaje;

                    mensaje.style.color =
                        "red";

                    return;
                }


                mensaje.textContent =
                    "✅ Currículum subido correctamente.";

                mensaje.style.color =
                    "green";


                document.getElementById(
                    "formCurriculum"
                ).reset();


                cargarPerfil();


            } catch (error) {

                console.error(error);

                mensaje.textContent =
                    "❌ No se pudo conectar con el servidor.";

                mensaje.style.color =
                    "red";

            }

        }
    );


// =====================================================
// CERRAR SESIÓN
// =====================================================

document
    .getElementById("btnCerrarSesion")
    .addEventListener(
        "click",
        async function() {

            try {

                await fetch(
                    "/api/logout",
                    {
                        method: "POST",
                        credentials: "same-origin"
                    }
                );

            } catch (error) {

                console.error(error);

            }

            window.location.href =
                "index.html";

        }
    );


// =====================================================
// SEGURIDAD PARA TEXTO
// =====================================================

function escapeHTML(texto) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// =====================================================
// INICIO
// =====================================================

cargarPerfil();

</script>

</body>

</html>
